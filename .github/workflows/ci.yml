name: CI Pipeline

on:
  push:
  workflow_dispatch:

jobs:
  test:
    name: Run automated tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pushed revision
        uses: actions/checkout@v4

      - name: Set up uv (uses Python from .python-version)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # A failing test makes pytest exit non-zero, which fails this step
      # and therefore the job. No continue-on-error here.
      - name: Run tests
        run: uv run pytest -v --json-report --json-report-file=report.json

      - name: Show test summary
        if: always()
        run: |
          echo "### Test results" >> "$GITHUB_STEP_SUMMARY"
          if [ -f report.json ]; then
            uv run python -c "import json; print(json.load(open('report.json'))['summary'])" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report generated (tests did not run)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload raw pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: report.json
          if-no-files-found: warn