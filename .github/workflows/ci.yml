name: CI Pipeline

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- 1. TESTS
  test:
    name: Run automated tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      # A failing test makes pytest exit non-zero -> this step and the job fail.
      - name: Run tests
        run: uv run pytest -v --json-report --json-report-file=report.json

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: report.json
          if-no-files-found: warn

  # ------------------------------------------- 2. REPORT TO MY PC (Tailscale)
  report:
    name: Send report to local receiver
    needs: test
    if: ${{ !cancelled() }}      # runs for passing AND failing test runs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download pytest report
        uses: actions/download-artifact@v4
        with:
          name: pytest-report
        continue-on-error: true   # missing if tests crashed before writing it

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Send report to PC
        env:
          PC_TAILSCALE_IP: ${{ secrets.PC_TAILSCALE_IP }}
          RECEIVER_SECRET: ${{ secrets.RECEIVER_SECRET }}
          TEST_JOB_RESULT: ${{ needs.test.result }}
        run: python3 scripts/send_report.py

  # ------------------------------------------------------- 3. EMAIL (bonus)
  email:
    name: Email test report
    needs: test
    if: ${{ !cancelled() }}      # passing AND failing runs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download pytest report
        uses: actions/download-artifact@v4
        with:
          name: pytest-report
        continue-on-error: true

      - name: Send email
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          TEST_JOB_RESULT: ${{ needs.test.result }}
        run: python3 scripts/send_email.py

  # ------------------------------------------------ 4. GITHUB PAGES (bonus)
  deploy:
    name: Deploy to GitHub Pages
    needs: test
    # Only on main AND only when every test passed. If tests fail this job is
    # skipped, so the previously published site stays unchanged.
    if: ${{ github.ref == 'refs/heads/main' && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend          # only the frontend folder is published
      - id: deployment
        uses: actions/deploy-pages@v4