name: CI Pipeline

on:
  push:
  workflow_dispatch:

jobs:
  test:
    name: Run automated tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      # A failing test makes pytest exit non-zero -> this step and the job fail.
      - name: Run tests
        run: uv run pytest -v --json-report --json-report-file=report.json

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: report.json
          if-no-files-found: warn

  report:
    name: Send report to local receiver
    needs: test
    if: always()          # run for passing AND failing test runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download pytest report
        uses: actions/download-artifact@v4
        with:
          name: pytest-report
        continue-on-error: true   # missing if tests crashed before writing it

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Send report to PC
        env:
          PC_TAILSCALE_IP: ${{ secrets.PC_TAILSCALE_IP }}
          RECEIVER_SECRET: ${{ secrets.RECEIVER_SECRET }}
          TEST_JOB_RESULT: ${{ needs.test.result }}
        run: python3 scripts/send_report.py

  email:
    name: Email test report
    needs: test
    if: always()          # passing AND failing runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download pytest report
        uses: actions/download-artifact@v4
        with:
          name: pytest-report
        continue-on-error: true

      - name: Send email
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          TEST_JOB_RESULT: ${{ needs.test.result }}
        run: python3 scripts/send_email.py

  deploy:
    name: Deploy to GitHub Pages
    needs: test
    # Only on main, and only if ALL tests passed. Otherwise this job is skipped
    # and the previously published site stays untouched.
    if: github.ref == 'refs/heads/main' && needs.test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend
      - id: deployment
        uses: actions/deploy-pages@v4