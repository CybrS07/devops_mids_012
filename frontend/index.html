<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DevOps Portal - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Portal Login</h2>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Username" required>
            <div style="position: relative;">
                <input type="password" id="password" placeholder="Password" required style="width: 100%;">
                <label style="font-size: 12px; display: block; margin-top: 5px;">
                    <input type="checkbox" id="showPassword" style="width: auto;"> Show Password
                </label>
            </div>
            <button type="submit" style="margin-top: 15px;">Login</button>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
